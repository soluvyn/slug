<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Slug</title>
<link rel="icon" href="/favicon.ico">
<link rel="stylesheet" href="/color.css">
</head>
<body>
<div class="app-container" id="app">

  <header class="app-header">
    <div class="header-left">
      <svg class="brand-icon" width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
        <circle cx="12" cy="12" r="3"/>
      </svg>
      <span class="brand-text">Slug</span>
    </div>

    <div class="header-center">
      <div class="mode-toggle" role="group" aria-label="Processing mode">
        <button class="btn-mode active" type="button" data-mode="standard" title="Standard mode">Standard</button>
        <button class="btn-mode" type="button" data-mode="pro" title="Pro mode">Pro</button>
      </div>
    </div>

    <div class="header-right">
      <button class="btn-icon btn-close" id="closeBtn" type="button" title="Close loaded image" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18 6 6 18"/>
          <path d="m6 6 12 12"/>
        </svg>
        <span>Close</span>
      </button>
      <button class="btn-icon btn-download" type="button" title="Download result" disabled>
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
          <polyline points="7 10 12 15 17 10"/>
          <line x1="12" y1="15" x2="12" y2="3"/>
        </svg>
        <span>Download</span>
      </button>

    </div>
  </header>

  <main class="app-main" id="main">

    <div class="landing-prompt" id="landing">
      <div class="dropzone" id="dropzone">
        <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M21 12v3a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V9a2 2 0 0 1 2-2h3"/>
          <circle cx="12" cy="12" r="3"/>
          <line x1="12" y1="2" x2="12" y2="12"/>
        </svg>
        <p>Drop an image here or click to Import</p>
      </div>
    </div>

    <div class="canvas-container" id="canvasContainer" hidden>
      <div class="canvas-scroll" id="canvasScroll">
        <div class="img-wrap">
          <div class="canvas-wrap">
            <canvas class="canvas-layer canvas-image" id="imageCanvas"></canvas>
            <canvas class="canvas-layer canvas-mask" id="maskCanvas"></canvas>
            <canvas class="canvas-layer canvas-preview" id="previewCanvas"></canvas>
            <canvas class="canvas-layer canvas-shape" id="shapeCanvas"></canvas>
            <div class="brush-cursor" id="brushCursor"></div>
          </div>
        </div>
      </div>
    </div>

  </main>

  <div class="toolbar-bottom" id="toolbarBottom" hidden>

    <div class="toolbar-group">
      <button class="btn-icon-sm" id="undoBtn" type="button" title="Undo (Ctrl+Z)" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="3 7 3 12 8 12"/>
          <path d="M21 17a9 9 0 0 0-15-6.7L3 12"/>
        </svg>
      </button>
      <button class="btn-icon-sm" id="redoBtn" type="button" title="Redo (Ctrl+Shift+Z)" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <polyline points="21 7 21 12 16 12"/>
          <path d="M3 17a9 9 0 0 1 15-6.7L21 12"/>
        </svg>
      </button>
    </div>

    <div class="divider-v"></div>

    <div class="toolbar-group">
      <button class="btn-icon-sm tool-active" id="brushBtn" type="button" title="Brush (B)" data-tool="brush">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M18.37 2.63 14 7l-1.59-1.59a2 2 0 0 0-2.82 0L8 7l9 9 1.59-1.59a2 2 0 0 0 0-2.82L17 10l4.37-4.37a2 2 0 0 0 0-2.82l-.18-.18a2 2 0 0 0-2.82 0zM9 8l-5 5c-.55.55-.55 1.43 0 1.98l.28.28L3 17l1.5 1.5L8 16l.74.74c.55.55 1.43.55 1.98 0L14 12"/>
        </svg>
      </button>
      <button class="btn-icon-sm" id="rectBtn" type="button" title="Rectangle (R)" data-tool="rect">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="2" ry="2"/>
        </svg>
      </button>
      <button class="btn-icon-sm" id="ellipseBtn" type="button" title="Ellipse (E)" data-tool="ellipse">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="12" cy="12" r="10"/>
        </svg>
      </button>
    </div>

    <div class="divider-v"></div>

    <div class="toolbar-group brush-size-group">
      <label class="brush-label" for="brushSlider">Size</label>
      <input class="brush-slider" type="range" id="brushSlider" min="8" max="96" value="24" aria-label="Brush size">
      <span class="brush-dot" id="brushDot"></span>
    </div>

    <div class="divider-v"></div>

    <div class="toolbar-group">
      <button class="btn-icon-sm" id="clearBtn" type="button" title="Clear mask" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="m15 15-6 6m0-6 6 6m5-12a9 9 0 1 1-18 0 9 9 0 0 1 18 0z"/>
        </svg>
      </button>
    </div>

    <div class="divider-v"></div>

    <div class="toolbar-group">
      <button class="btn-remove" id="removeBtn" type="button" title="Remove watermark" disabled>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M14.7 6.3a1 1 0 0 0 0 1.4l1.6 1.6a1 1 0 0 0 1.4 0l3.77-3.77a6 6 0 0 1-7.94 7.94l-6.91 6.91a2.12 2.12 0 0 1-3-3l6.91-6.91a6 6 0 0 1 7.94-7.94l-3.76 3.76z"/>
        </svg>
        <span>Remove</span>
      </button>
    </div>

    <div class="divider-v"></div>

    <div class="toolbar-group zoom-group">
      <button class="btn-icon-sm" id="zoomOutBtn" type="button" title="Zoom out">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
      <button class="btn-zoom-label" id="zoomLabel" type="button" title="Reset zoom to 100%">100%</button>
      <button class="btn-icon-sm" id="zoomInBtn" type="button" title="Zoom in">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <circle cx="11" cy="11" r="8"/>
          <line x1="21" y1="21" x2="16.65" y2="16.65"/>
          <line x1="11" y1="8" x2="11" y2="14"/>
          <line x1="8" y1="11" x2="14" y2="11"/>
        </svg>
      </button>
    </div>

  </div>

  <input type="file" id="fileInput" class="sr-only" accept="image/*" aria-label="Choose an image file">

  <div class="spinner-overlay" id="spinner" hidden></div>

  <div class="toast" id="toast" role="status" hidden>
    <span class="toast-text" id="toastText"></span>
  </div>

  <div class="confirm-overlay" id="confirmOverlay" hidden>
    <div class="confirm-card" role="dialog" aria-modal="true" aria-labelledby="confirmText" aria-describedby="confirmText">
      <p class="confirm-text" id="confirmText">Unsaved changes will be lost.</p>
      <div class="confirm-actions">
        <button type="button" class="btn-secondary" id="confirmCancel">Cancel</button>
        <button type="button" class="btn-primary" id="confirmOk">Import anyway</button>
      </div>
    </div>
  </div>

</div>
<script type="module" src="/app/main.js"></script>
</body>
</html>
